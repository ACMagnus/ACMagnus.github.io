<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2D逃离学校｜无文字版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a12;display:flex;justify-content:center;padding:20px}
#gameWrap{width:860px}
/* 2D游戏画布区域 */
#sceneCanvas{
    width:100%;
    height:320px;
    background:#141826;
    border:4px solid #333a54;
    border-radius:14px;
    position:relative;
    overflow:hidden;
    margin-bottom:16px;
}
/* 场景背景图 */
.sceneBg{
    width:100%;
    height:100%;
    object-fit:cover;
    position:absolute;
    z-index:1;
}
/* 玩家2D小人 */
.player{
    width:42px;height:64px;
    background:#ffdd44;
    position:absolute;
    bottom:20px;left:60px;
    border-radius:8px 8px 2px 2px;
    z-index:3;
}
.player::after{
    content:"";
    width:32px;height:32px;
    background:#ffdd44;
    border-radius:50%;
    position:absolute;top:-20px;left:5px;
}
/* 保安NPC */
.guard{
    width:46px;height:68px;
    background:#ff3333;
    position:absolute;
    bottom:20px;right:70px;
    border-radius:8px 8px 2px 2px;
    display:none;
    z-index:3;
}
.guard::after{
    content:"";
    width:32px;height:32px;
    background:#ff3333;
    border-radius:50%;
    position:absolute;top:-20px;left:7px;
}
/* 互动提示闪光标记 */
.pointMark{
    width:18px;height:18px;
    background:#0ff;
    border-radius:50%;
    position:absolute;
    animation:flash 1s infinite;
    z-index:4;
}
@keyframes flash{0%,100%{opacity:0.2}50%{opacity:1}}
/* 背包道具栏 */
.bagBox{
    background:#181c2e;
    border:3px solid #333a54;
    border-radius:12px;
    padding:14px;
    margin-bottom:16px;
}
.bagIcons{
    display:flex;gap:12px;min-height:44px;
}
.itemIcon{
    width:40px;height:40px;
    background:#ff6677;
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:#000;
}
.emptyTip{color:#666;font-size:14px}
/* 操作按钮区 纯图标按钮 */
.btnPanel{
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px
}
.iconBtn{
    height:54px;font-size:24px;border:none;border-radius:10px;
    background:#2c3148;color:#fff;cursor:pointer;transition:0.2s
}
.iconBtn:hover{background:#ff6677}
/* 数字密码面板 */
.pwdPanel{
    display:none;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    background:#181c2e;
    padding:12px;border-radius:12px;margin-bottom:16px
}
.numKey{
    height:48px;font-size:22px;border:none;border-radius:8px;
    background:#393f5a;color:#fff;cursor:pointer
}
/* 结局图标提示 */
.endIcon{
    text-align:center;font-size:60px;margin-top:10px
}
.win{color:#4cf088}
.lose{color:#ff5555}
/* 底部消息提示条（极简图标） */
.tipBar{
    height:24px;font-size:20px;text-align:center;margin-bottom:8px;color:#4cf088
}
</style>
</head>
<body>
<div id="gameWrap">
    <div class="tipBar" id="tipIcon"></div>
    <!-- 2D游戏场景画布 -->
    <div id="sceneCanvas">
        <img class="sceneBg" id="bgImg" alt="">
        <div class="player"></div>
        <div class="guard" id="guardObj"></div>
        <!-- 互动闪光点标记 -->
        <div class="pointMark" style="top:100px;left:160px" id="mark1"></div>
        <div class="pointMark" style="top:160px;left:320px" id="mark2"></div>
    </div>
    <!-- 道具背包 -->
    <div class="bagBox">
        <div class="bagIcons" id="bagContainer">
            <span class="emptyTip">○</span>
        </div>
    </div>
    <!-- 操作图标按钮 -->
    <div class="btnPanel" id="buttonArea"></div>
    <!-- 密码数字键盘 -->
    <div class="pwdPanel" id="passwordPad">
        <button class="numKey" onclick="inputNum(1)">1</button>
        <button class="numKey" onclick="inputNum(2)">2</button>
        <button class="numKey" onclick="inputNum(0)">0</button>
        <button class="numKey" onclick="confirmPwd()">✓</button>
    </div>
    <!-- 结局大图标 -->
    <div class="endIcon" id="endDisplay"></div>
</div>

<script>
// 游戏核心数据
const game = {
    room:"classroom",
    items:[],
    readNote:false,
    inputCode:"",
    correctCode:"1207"
}
// 所有场景配置：无文字，只用图标、背景、按钮图标、保安显示
const sceneData = {
    classroom:{
        bg:"https://picsum.photos/id/20/900/400",
        guardShow:false,
        marksShow:true,
        buttons:[
            {icon:"📖",act:"checkBook"},
            {icon:"🗄️",act:"openDrawer"},
            {icon:"➡️",act:"goHall"}
        ]
    },
    hall:{
        bg:"https://picsum.photos/id/1067/900/400",
        guardShow:false,
        marksShow:true,
        buttons:[
            {icon:"🪝",act:"pickWire"},
            {icon:"🚪",act:"goOffice"},
            {icon:"stairs",act:"goLobby"},
            {icon:"⬅️",act:"backClass"}
        ]
    },
    office:{
        bg:"https://picsum.photos/id/416/900/400",
        guardShow:false,
        marksShow:true,
        buttons:[
            {icon:"🔪",act:"pickKnife"},
            {icon:"📅",act:"checkCalendar"},
            {icon:"⬅️",act:"backHall"}
        ]
    },
    lobby:{
        bg:"https://picsum.photos/id/1070/900/400",
        guardShow:true,
        marksShow:false,
        buttons:[
            {icon:"🌀",act:"hidePipe"},
            {icon:"🏃",act:"rushGate"},
            {icon:"⬅️",act:"backHall"}
        ]
    },
    gate:{
        bg:"https://picsum.photos/id/1071/900/400",
        guardShow:false,
        marksShow:false,
        buttons:[
            {icon:"🔐",act:"openPwdPad"},
            {icon:"🪝",act:"tryWireLock"},
            {icon:"⬅️",act:"backLobby"}
        ]
    },
    caught:{
        bg:"https://picsum.photos/id/1072/900/400",
        guardShow:true,
        marksShow:false,
        buttons:[],
        end:"lose"
    },
    wireFail:{
        bg:"https://picsum.photos/id/1073/900/400",
        guardShow:false,
        marksShow:false,
        buttons:[],
        end:"lose"
    },
    escapeWin:{
        bg:"https://picsum.photos/id/1074/900/400",
        guardShow:false,
        marksShow:false,
        buttons:[],
        end:"win"
    }
}

// 全局渲染函数
function render(){
    const s = sceneData[game.room]
    // 场景背景图
    document.getElementById("bgImg").src = s.bg
    // 保安显示控制
    document.getElementById("guardObj").style.display = s.guardShow ? "block" : "none"
    // 互动光点标记
    document.getElementById("mark1").style.display = s.marksShow ? "block" : "none"
    document.getElementById("mark2").style.display = s.marksShow ? "block" : "none"
    // 道具背包图标渲染
    let bagHtml = ""
    if(game.items.length === 0){
        bagHtml = `<span class="emptyTip">○</span>`
    }else{
        game.items.forEach(it=>{
            let ico = it=="铁丝"?"🪝":"🔪"
            bagHtml += `<div class="itemIcon">${ico}</div>`
        })
    }
    document.getElementById("bagContainer").innerHTML = bagHtml
    // 操作按钮图标渲染
    let btnHtml = ""
    s.buttons.forEach(b=>{
        btnHtml += `<button class="iconBtn" onclick="${b.act}()">${b.icon}</button>`
    })
    document.getElementById("buttonArea").innerHTML = btnHtml
    // 密码面板默认隐藏
    document.getElementById("passwordPad").style.display = "none"
    game.inputCode = ""
    // 结局图标
    let endDom = document.getElementById("endDisplay")
    endDom.innerText = ""
    if(s.end=="win"){
        endDom.innerText = "✅"
        endDom.className = "endIcon win"
    }else if(s.end=="lose"){
        endDom.innerText = "❌"
        endDom.className = "endIcon lose"
    }
    // 清空提示
    document.getElementById("tipIcon").innerText = ""
}

// 顶部图标提示
function showTip(icon){
    document.getElementById("tipIcon").innerText = icon
    setTimeout(()=>document.getElementById("tipIcon").innerText="",1800)
}

// 房间切换函数
function goHall(){game.room="hall";render()}
function backClass(){game.room="classroom";render()}
function goOffice(){game.room="office";render()}
function backHall(){game.room="hall";render()}
function goLobby(){game.room="lobby";render()}
function backLobby(){game.room="lobby";render()}
function hidePipe(){game.room="gate";showTip("👁️");render()}
function rushGate(){game.room="caught";render()}

// 教室交互
function checkBook(){
    if(game.readNote) return showTip("📖")
    game.readNote = true
    showTip("💡")
    render()
}
function openDrawer(){
    if(game.items.includes("美工刀")) showTip("📦")
    else showTip("🔒")
}

// 走廊拾取道具
function pickWire(){
    if(game.items.includes("铁丝")) return showTip("🪝")
    game.items.push("铁丝")
    showTip("➕🪝")
    render()
}

// 办公室交互
function pickKnife(){
    if(game.items.includes("美工刀")) return showTip("🔪")
    game.items.push("美工刀")
    showTip("➕🔪")
    render()
}
function checkCalendar(){showTip("🔢")}

// 校门密码面板
function openPwdPad(){
    if(!game.readNote) return showTip("🚫")
    document.getElementById("passwordPad").style.display = "grid"
}
function inputNum(num){
    if(game.inputCode.length<4) game.inputCode += num
}
function confirmPwd(){
    if(game.inputCode === game.correctCode){
        game.room = "escapeWin"
    }else{
        game.room = "caught"
    }
    render()
}

// 铁丝撬锁失败
function tryWireLock(){
    if(game.items.includes("铁丝")) game.room="wireFail"
    else showTip("❌🪝")
    render()
}

// 游戏初始化
render()
</script>
</body>
</html>
