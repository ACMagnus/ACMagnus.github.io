<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>逃离学校 图片解谜版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif}
body{background:#0f172a;color:#f1f5f9;padding:24px;max-width:900px;margin:0 auto}
.container{background:#1e293b;padding:30px;border-radius:16px;box-shadow:0 0 30px #334155}
h1{text-align:center;color:#fb7185;margin-bottom:20px}

.scene-image{
    width:100%;
    height:260px;
    background:#334155;
    border-radius:12px;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#94a3b8;
    font-size:15px;
    overflow:hidden;
}

.scene-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.story-text{font-size:17px;line-height:1.7;margin-bottom:20px;min-height:90px;color:#e2e8f0}
.bag-area{background:#334155;padding:14px;border-radius:10px;margin-bottom:22px}
.bag-title{color:#facc15;margin-bottom:8px}
.item-wrap{display:flex;gap:10px;flex-wrap:wrap}
.item{background:#fb7185;padding:5px 12px;border-radius:6px;font-size:14px}
.empty{color:#94a3b8}
.btn-box{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
button{padding:13px;font-size:16px;border:none;border-radius:8px;background:#475569;color:#fff;cursor:pointer;transition:0.2s}
button:hover{background:#fb7185}
.tip{color:#34d399;height:22px;margin-bottom:10px}
.ending{font-size:26px;text-align:center;font-weight:bold;margin-top:30px}
.win{color:#4ade80}
.lose{color:#f87171}
</style>
</head>
<body>
<div class="container">
    <h1>🏫 深夜逃离学校 图片解谜版</h1>
    <div class="tip" id="tip"></div>

    <div class="scene-image" id="sceneImage">
        <img src="https://picsum.photos/id/20/900/400" alt="场景图片">
    </div>

    <div class="story-text" id="story"></div>

    <div class="bag-area">
        <div class="bag-title">背包道具</div>
        <div class="item-wrap" id="bagList"></div>
    </div>

    <div class="btn-box" id="btnGroup"></div>
    <div class="ending" id="endText"></div>
</div>

<script>
const gameData = {
    currentRoom: "classroom",
    items: [],
    gameOver: false,
    guardPatrol: false,
    notebookRead: false,
    password: "1207",
    usedWire: false
}

const rooms = {
    classroom: {
        image: "https://picsum.photos/id/20/900/400",
        desc: "你被困在三楼教室，天色完全黑了。教室后门通向走廊，讲台上有一本笔记本，课桌抽屉锁死，窗户焊死无法翻越。远处偶尔传来保安的脚步声。",
        choices: [
            {txt: "查看讲台笔记本", act: "readBook"},
            {txt: "打开课桌抽屉（需要工具撬开）", act: "deskLock"},
            {txt: "走出教室前往走廊", act: "toHall"}
        ]
    },
    hall: {
        image: "https://picsum.photos/id/1067/900/400",
        desc: "三楼走廊，左右两条通道。左侧楼梯通往一楼大厅，右侧是教师办公室。保安正在一楼巡逻，不能贸然下楼。地面角落有一根细铁丝。",
        choices: [
            {txt: "拾取地上铁丝", act: "getWire"},
            {txt: "进入教师办公室", act: "toOffice"},
            {txt: "走楼梯下楼", act: "toLobby"},
            {txt: "返回教室", act: "toClassroom"}
        ]
    },
    office: {
        image: "https://picsum.photos/id/416/900/400",
        desc: "教师办公室，办公桌放着美工刀，柜子上贴着一张纸条：大门密码是班主任生日。桌上日历写着：07.12。",
        choices: [
            {txt: "拿走美工刀", act: "getKnife"},
            {txt: "返回三楼走廊", act: "toHall"}
        ]
    },
    lobby: {
        image: "https://picsum.photos/id/1070/900/400",
        desc: "一楼大厅，校门是电子密码锁。保安就在大厅门口来回走动，直接靠近会被抓住。墙角通风管道可以暂时躲藏。",
        choices: [
            {txt: "躲进通风管道等待保安走远", act: "hidePipe"},
            {txt: "直接冲向校门", act: "caughtGuard"},
            {txt: "返回三楼走廊", act: "toHall"}
        ]
    },
    gate: {
        image: "https://picsum.photos/id/1071/900/400",
        desc: "保安暂时离开，面前电子锁需要4位数字密码。没有密码无法开门。",
        choices: [
            {txt: "输入密码开门", act: "inputPwd"},
            {txt: "用铁丝尝试撬开电子锁", act: "wireLock"},
            {txt: "返回大厅躲避", act: "toLobby"}
        ]
    },
    fail_caught: {
        image: "https://picsum.photos/id/1072/900/400",
        desc: "保安当场发现你，直接把你带回教务处，逃离失败。",
        choices: [],
        end: "lose"
    },
    fail_wire: {
        image: "https://picsum.photos/id/1073/900/400",
        desc: "电子锁结构精密，铁丝完全没用，动静引来保安，你被抓住了。",
        choices: [],
        end: "lose"
    },
    success: {
        image: "https://picsum.photos/id/1074/900/400",
        desc: "密码正确！校门电子锁解锁，你推开大门，成功逃出空无一人的校园！",
        choices: [],
        end: "win"
    }
}

function render(){
    const room = rooms[gameData.currentRoom]

    document.getElementById("sceneImage").innerHTML = `<img src="${room.image}" alt="${gameData.currentRoom}">`;
    document.getElementById("story").innerText = room.desc

    let bagHtml = ""
    if(gameData.items.length === 0){
        bagHtml = `<span class="empty">无道具</span>`
    }else{
        gameData.items.forEach(item=>{
            bagHtml += `<span class="item">${item}</span>`
        })
    }
    document.getElementById("bagList").innerHTML = bagHtml

    let btnHtml = ""
    room.choices.forEach(c=>{
        btnHtml += `<button onclick="${c.act}()">${c.txt}</button>`
    })
    document.getElementById("btnGroup").innerHTML = btnHtml

    const endDom = document.getElementById("endText")
    endDom.innerText = ""
    endDom.className = ""
    if(room.end === "win"){
        endDom.innerText = "🎉 逃离成功！游戏通关"
        endDom.className = "ending win"
    }else if(room.end === "lose"){
        endDom.innerText = "💀 游戏失败，刷新页面重新游玩"
        endDom.className = "ending lose"
    }
}

function showTip(text){
    document.getElementById("tip").innerText = text
    setTimeout(()=>document.getElementById("tip").innerText="",2500)
}

function toClassroom(){
    gameData.currentRoom = "classroom"
    render()
}
function toHall(){
    gameData.currentRoom = "hall"
    render()
}
function toOffice(){
    gameData.currentRoom = "office"
    render()
}
function toLobby(){
    gameData.currentRoom = "lobby"
    render()
}

function readBook(){
    if(gameData.notebookRead){
        showTip("你已经看过笔记本了，内容是：大门密码藏在办公室日历中")
        return
    }
    gameData.notebookRead = true
    showTip("笔记本记录：校门密码在办公室日历纸条上，日期颠倒使用")
    render()
}

function deskLock(){
    if(gameData.items.includes("美工刀")){
        showTip("撬开抽屉，里面只有一张废纸，没有有用道具")
    }else{
        showTip("抽屉锁死，你没有工具无法打开")
    }
}

function getWire(){
    if(gameData.items.includes("铁丝")){
        showTip("你已经拾取过铁丝了")
        return
    }
    gameData.items.push("铁丝")
    showTip("获得道具：铁丝")
    render()
}

function getKnife(){
    if(gameData.items.includes("美工刀")){
        showTip("美工刀你已经拿了")
        return
    }
    gameData.items.push("美工刀")
    showTip("获得道具：美工刀")
    render()
}

function caughtGuard(){
    gameData.currentRoom = "fail_caught"
    render()
}

function hidePipe(){
    gameData.currentRoom = "gate"
    showTip("你躲进管道等待片刻，保安走远，现在可以操作校门锁")
    render()
}

function wireLock(){
    gameData.currentRoom = "fail_wire"
    render()
}

function inputPwd(){
    if(!gameData.notebookRead){
        showTip("你不知道密码线索，无法解锁")
        return
    }
    gameData.currentRoom = "success"
    render()
}

render()
</script>
</body>
</html>
