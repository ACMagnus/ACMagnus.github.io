<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>逃离学校</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑}
        body{background:#1a1a2e;color:#fff;padding:30px;max-width:800px;margin:0 auto}
        .box{background:#16213e;padding:25px;border-radius:12px;box-shadow:0 0 20px #0f3460}
        h1{text-align:center;margin-bottom:20px;color:#e94560}
        .scene{font-size:18px;line-height:1.8;margin-bottom:20px;min-height:80px}
        .bag{background:#0f3460;padding:12px;border-radius:8px;margin-bottom:20px}
        .bag h3{margin-bottom:8px;color:#f1c40f}
        #itemList{display:flex;gap:10px;flex-wrap:wrap}
        .item{background:#e94560;padding:6px 12px;border-radius:6px}
        .btn-group{display:flex;flex-direction:column;gap:12px}
        button{padding:12px;font-size:16px;border:none;border-radius:8px;cursor:pointer;background:#533483;color:#fff;transition:0.2s}
        button:hover{background:#e94560}
        .end{font-size:24px;text-align:center;margin-top:30px;font-weight:bold}
    </style>
</head>
<body>
    <div class="box">
        <h1>🏫 逃离学校</h1>
        <!-- 剧情文字 -->
        <div class="scene" id="story"></div>
        <!-- 背包道具 -->
        <div class="bag">
            <h3>背包道具：</h3>
            <div id="itemList"></div>
        </div>
        <!-- 选择按钮 -->
        <div class="btn-group" id="btns"></div>
        <!-- 结局提示 -->
        <div class="end" id="result"></div>
    </div>

<script>
// 游戏数据
let game = {
    scene: "classroom", // 当前场景
    items: [],          // 背包
    over: false         // 游戏是否结束
}

// 所有场景配置
const scenes = {
    classroom: {
        text: "放学后所有人都走了，教室门被锁住。你被困在教室，窗外是漆黑操场。桌上有一把美工刀，后门通往走廊。",
        options: [
            {text:"拿起桌上美工刀",action:"getKnife"},
            {text:"尝试推开后门去走廊",action:"goHall"}
        ]
    },
    hall: {
        text: "空旷走廊，尽头是保安室，一楼大门紧锁。墙角地上放着一根铁丝，保安室门口有保安打盹。",
        options: [
            {text:"捡起铁丝",action:"getWire"},
            {text:"偷偷溜去一楼大门",action:"goGate"},
            {text:"返回教室",action:"goClassroom"}
        ]
    },
    gate: {
        text: "学校大门是密码锁，单纯推不开。保安就在不远处巡逻，直接冲会被抓住。",
        options: [
            {text:"用美工刀撬锁",action:"tryKnife"},
            {text:"用铁丝开锁",action:"tryWire"},
            {text:"退回走廊",action:"goHall"}
        ]
    },
    lose: {
        text: "美工刀太脆，撬锁发出巨响！保安闻声赶来，把你抓住，逃离失败。",
        options: [],
        end: "lose"
    },
    win: {
        text: "铁丝完美勾开密码锁！大门打开，你成功逃出学校！",
        options: [],
        end: "win"
    }
}

// 刷新页面内容
function render(){
    const s = scenes[game.scene]
    document.getElementById("story").innerText = s.text
    // 渲染道具
    let itemHtml = ""
    if(game.items.length === 0) itemHtml = "<span>空</span>"
    game.items.forEach(i=>itemHtml += `<span class="item">${i}</span>`)
    document.getElementById("itemList").innerHTML = itemHtml
    // 渲染按钮
    let btnHtml = ""
    s.options.forEach(opt=>{
        btnHtml += `<button onclick="${opt.action}()">${opt.text}</button>`
    })
    document.getElementById("btns").innerHTML = btnHtml
    // 结局文字
    const resBox = document.getElementById("result")
    if(s.end === "win"){
        resBox.style.color="#2ecc71"
        resBox.innerText="🎉 逃离成功！游戏通关"
    }else if(s.end === "lose"){
        resBox.style.color="#e74c3c"
        resBox.innerText="💀 游戏失败，重新打开页面再来一次"
    }else{
        resBox.innerText=""
    }
}

// 操作函数
function getKnife(){
    if(!game.items.includes("美工刀")) game.items.push("美工刀")
    render()
}
function getWire(){
    if(!game.items.includes("铁丝")) game.items.push("铁丝")
    render()
}
function goClassroom(){game.scene="classroom";render()}
function goHall(){game.scene="hall";render()}
function goGate(){game.scene="gate";render()}
function tryKnife(){game.scene="lose";render()}
function tryWire(){
    if(game.items.includes("铁丝")){
        game.scene="win"
    }else{
        document.getElementById("story").innerText="你没有铁丝，无法开锁，先去走廊寻找道具！"
    }
    render()
}

// 启动游戏
render()
</script>
</body>
</html>
