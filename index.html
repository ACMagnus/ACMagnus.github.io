<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>逃离学校 2D像素版</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft Yahei",sans-serif;
}

body{
    background:#111827;
    color:#f9fafb;
    padding:20px;
    max-width:900px;
    margin:0 auto;
}

.game-title{
    text-align:center;
    color:#f87171;
    margin-bottom:20px;
    font-size:28px;
    letter-spacing:1px;
}

.game-screen{
    background:#1f2937;
    border:3px solid #374151;
    border-radius:16px;
    padding:18px;
    box-shadow:0 0 25px rgba(0,0,0,0.3);
}

.scene-box{
    width:100%;
    height:280px;
    background:#111827;
    border-radius:12px;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
    border:2px solid #4b5563;
}

.scene-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.character{
    position:absolute;
    bottom:12px;
    left:50px;
    width:40px;
    height:60px;
    background:#fde047;
    border:2px solid #000;
    border-radius:6px 6px 2px 2px;
    z-index:2;
}

.character::before{
    content:"";
    position:absolute;
    top:-18px;
    left:5px;
    width:30px;
    height:30px;
    background:#fde047;
    border:2px solid #000;
    border-radius:50%;
}

.guard{
    position:absolute;
    bottom:12px;
    right:60px;
    width:45px;
    height:65px;
    background:#ef4444;
    border:2px solid #000;
    border-radius:6px 6px 2px 2px;
    z-index:2;
}

.guard::before{
    content:"";
    position:absolute;
    top:-18px;
    left:7px;
    width:30px;
    height:30px;
    background:#ef4444;
    border:2px solid #000;
    border-radius:50%;
}

.dialogue{
    background:#111827;
    border:2px solid #4b5563;
    border-radius:12px;
    padding:16px;
    margin-bottom:18px;
    min-height:90px;
    line-height:1.6;
    color:#e5e7eb;
}

.bag-area{
    background:#1f2937;
    border:2px solid #374151;
    border-radius:12px;
    padding:14px;
    margin-bottom:18px;
}

.bag-title{
    color:#fde047;
    margin-bottom:10px;
    font-size:16px;
}

.item-wrap{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.item{
    background:#f87171;
    color:#111827;
    padding:6px 12px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
}

.empty{
    color:#9ca3af;
}

.btn-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:18px;
}

button{
    padding:14px;
    font-size:15px;
    border:none;
    border-radius:10px;
    background:#4b5563;
    color:#f9fafb;
    cursor:pointer;
    transition:0.2s;
    font-weight:bold;
}

button:hover{
    background:#f87171;
    color:#111827;
}

.tip{
    color:#34d399;
    margin-bottom:12px;
    min-height:24px;
}

.ending{
    font-size:28px;
    text-align:center;
    font-weight:bold;
    margin-top:20px;
}

.win{
    color:#34d399;
}

.lose{
    color:#f87171;
}

.password-box{
    display:none;
    gap:10px;
    margin-top:12px;
}

.password-box input{
    flex:1;
    padding:12px;
    font-size:16px;
    border-radius:8px;
    border:2px solid #4b5563;
    background:#111827;
    color:#f9fafb;
    text-align:center;
    letter-spacing:4px;
}

.password-box button{
    width:120px;
}

@media(max-width:640px){
    .btn-box{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<h1 class="game-title">🏫 逃离学校 2D像素版</h1>

<div class="game-screen">
    <div class="tip" id="tip"></div>

    <div class="scene-box" id="sceneBox">
        <img src="https://picsum.photos/id/20/900/400" alt="场景">
        <div class="character" id="player"></div>
        <div class="guard" id="guard" style="display:none;"></div>
    </div>

    <div class="dialogue" id="dialogue"></div>

    <div class="bag-area">
        <div class="bag-title">🎒 背包道具</div>
        <div class="item-wrap" id="bagList">
            <span class="empty">无道具</span>
        </div>
    </div>

    <div class="btn-box" id="btnGroup"></div>

    <div class="password-box" id="passwordBox">
        <input type="text" id="pwdInput" maxlength="4" placeholder="输入4位密码">
        <button onclick="checkPassword()">确认</button>
    </div>

    <div class="ending" id="endText"></div>
</div>

<script>
const gameData = {
    currentRoom: "classroom",
    items: [],
    notebookRead: false,
    passwordCorrect: false
}

const rooms = {
    classroom: {
        image: "https://picsum.photos/id/20/900/400",
        dialogue: "放学后的教室一片安静，门已经被锁住。你必须找到线索和道具，从学校逃出去。",
        choices: [
            {txt: "检查讲台", act: "checkDesk"},
            {txt: "检查课桌抽屉", act: "checkDrawer"},
            {txt: "前往走廊", act: "toHall"}
        ],
        showGuard: false
    },
    hall: {
        image: "https://picsum.photos/id/1067/900/400",
        dialogue: "昏暗的走廊里，保安室方向传来脚步声。你需要小心行动，不能直接被发现。",
        choices: [
            {txt: "拾取地上的铁丝", act: "getWire"},
            {txt: "进入教师办公室", act: "toOffice"},
            {txt: "下楼去大厅", act: "toLobby"},
            {txt: "返回教室", act: "toClassroom"}
        ],
        showGuard: false
    },
    office: {
        image: "https://picsum.photos/id/416/900/400",
        dialogue: "教师办公室里有美工刀、日历和一张便签。便签上写着：校门密码由班主任生日组成。",
        choices: [
            {txt: "拿走美工刀", act: "getKnife"},
            {txt: "查看日历", act: "checkCalendar"},
            {txt: "返回走廊", act: "toHall"}
        ],
        showGuard: false
    },
    lobby: {
        image: "https://picsum.photos/id/1070/900/400",
        dialogue: "一楼大厅就在眼前，但保安正在门口巡逻。直接冲出去一定会被抓住。",
        choices: [
            {txt: "躲进通风管道", act: "hidePipe"},
            {txt: "直接冲向校门", act: "rushGate"},
            {txt: "返回走廊", act: "toHall"}
        ],
        showGuard: true
    },
    gate: {
        image: "https://picsum.photos/id/1071/900/400",
        dialogue: "保安暂时离开了。校门有一个电子密码锁，你需要输入正确密码才能打开。",
        choices: [
            {txt: "输入密码开门", act: "showPasswordInput"},
            {txt: "用铁丝尝试撬锁", act: "tryWireLock"},
            {txt: "返回大厅", act: "toLobby"}
        ],
        showGuard: false,
        showPassword: false
    },
    fail_caught: {
        image: "https://picsum.photos/id/1072/900/400",
        dialogue: "保安发现了你，手电筒照向你。你被带回教务处，逃离失败。",
        choices: [],
        ending: "lose",
        showGuard: true
    },
    fail_wire: {
        image: "https://picsum.photos/id/1073/900/400",
        dialogue: "铁丝没能打开电子锁，反而触发了轻微警报。保安迅速赶来，你被抓住了。",
        choices: [],
        ending: "lose",
        showGuard: false
    },
    success: {
        image: "https://picsum.photos/id/1074/900/400",
        dialogue: "密码正确！电子锁发出咔哒一声，校门打开了。你终于逃出了学校。",
        choices: [],
        ending: "win",
        showGuard: false
    }
}

function render(){
    const room = rooms[gameData.currentRoom]

    document.querySelector("#sceneBox img").src = room.image;
    document.getElementById("dialogue").innerText = room.dialogue;

    const guard = document.getElementById("guard");
    guard.style.display = room.showGuard ? "block" : "none";

    let bagHtml = "";
    if(gameData.items.length === 0){
        bagHtml = `<span class="empty">无道具</span>`;
    }else{
        gameData.items.forEach(item=>{
            bagHtml += `<span class="item">${item}</span>`;
        });
    }
    document.getElementById("bagList").innerHTML = bagHtml;

    let btnHtml = "";
    room.choices.forEach(c=>{
        btnHtml += `<button onclick="${c.act}()">${c.txt}</button>`;
    });
    document.getElementById("btnGroup").innerHTML = btnHtml;

    document.getElementById("passwordBox").style.display = "none";
    document.getElementById("pwdInput").value = "";

    const endDom = document.getElementById("endText");
    endDom.innerText = "";
    endDom.className = "";

    if(room.ending === "win"){
        endDom.innerText = "🎉 逃离成功！";
        endDom.className = "ending win";
    }else if(room.ending === "lose"){
        endDom.innerText = "💀 游戏失败";
        endDom.className = "ending lose";
    }
}

function showTip(text){
    document.getElementById("tip").innerText = text;
    setTimeout(()=>document.getElementById("tip").innerText="",2500);
}

function toClassroom(){
    gameData.currentRoom = "classroom";
    render();
}

function toHall(){
    gameData.currentRoom = "hall";
    render();
}

function toOffice(){
    gameData.currentRoom = "office";
    render();
}

function toLobby(){
    gameData.currentRoom = "lobby";
    render();
}

function checkDesk(){
    if(gameData.notebookRead){
        showTip("讲台上的笔记本你已经看过了。");
        return;
    }
    gameData.notebookRead = true;
    showTip("笔记本写着：办公室日历里藏着校门密码，日期需要颠倒使用。");
    render();
}

function checkDrawer(){
    if(gameData.items.includes("美工刀")){
        showTip("你用美工刀撬开了抽屉，里面只有一张废纸。");
    }else{
        showTip("抽屉锁着，你需要工具才能打开。");
    }
}

function getWire(){
    if(gameData.items.includes("铁丝")){
        showTip("你已经捡过铁丝了。");
        return;
    }
    gameData.items.push("铁丝");
    showTip("获得道具：铁丝");
    render();
}

function getKnife(){
    if(gameData.items.includes("美工刀")){
        showTip("美工刀你已经拿了。");
        return;
    }
    gameData.items.push("美工刀");
    showTip("获得道具：美工刀");
    render();
}

function checkCalendar(){
    showTip("日历上圈着：07月12日。笔记本说要颠倒使用……");
}

function hidePipe(){
    gameData.currentRoom = "gate";
    showTip("你躲进通风管道，等保安走远后，悄悄来到校门。");
    render();
}

function rushGate(){
    gameData.currentRoom = "fail_caught";
    render();
}

function showPasswordInput(){
    if(!gameData.notebookRead){
        showTip("你还不知道密码线索，先不要随便尝试。");
        return;
    }
    document.getElementById("passwordBox").style.display = "flex";
}

function checkPassword(){
    const input = document.getElementById("pwdInput").value.trim();

    if(input === "1207"){
        gameData.currentRoom = "success";
        render();
    }else{
        showTip("密码错误！保安听到动静，赶了过来。");
        gameData.currentRoom = "fail_caught";
        render();
    }
}

function tryWireLock(){
    if(gameData.items.includes("铁丝")){
        gameData.currentRoom = "fail_wire";
        render();
    }else{
        showTip("你没有铁丝。");
    }
}

render();
</script>

</body>
</html>
